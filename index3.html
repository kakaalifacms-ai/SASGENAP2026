<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tabungan Siswa</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <div class="container">
    
    <h2>Buku Tabungan Siswa</h2>
    
    <input type="number" id="setoran" placeholder="Masukkan Setoran">
    
    <button class="btn-tambah" onclick="tambahSetoran()">
      Tambah Setoran
    </button>
    
    <button class="btn-hapus" onclick="hapusSetoran()">
      Hapus Terakhir
    </button>
    
    <button class="btn-reset" onclick="resetTabungan()">
      Reset
    </button>
    
    <button class="btn-update" onclick="cetakSaldo()">
      Cetak Saldo
    </button>
    
    <h3>Riwayat Setoran</h3>
    
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Setoran</th>
        </tr>
      </thead>
      
      <tbody id="riwayat"></tbody>
    </table>
    
    <div id="hasilSaldo"></div>
    
    <br>

    
  </div>
  
  <script src="main2.js"></script>
  
</body>

</html>
